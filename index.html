<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiteClient | Fast, native REST API client for VS Code</title>
    <meta name="description"
        content="No accounts, no bloat, privacy-first. The lightweight REST API client built specifically for VS Code.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="one-pager">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">🌓</button>
        <div class="content">
            <header>
                <div class="logo">⚡ LiteClient</div>
            </header>

            <section class="hero">
                <h1>API Testing, Simplified.</h1>
                <p>Fast, native, and privacy-first. A REST API client for VS Code that stays out of your way.</p>

                <div class="actions">
                    <a href="https://marketplace.visualstudio.com/items?itemName=liteclient.liteclient" target="_blank"
                        class="btn">Install for VS Code</a>
                    <a href="https://github.com/liteclienthq/liteclient-issues" target="_blank"
                        class="btn btn-outline">GitHub</a>
                </div>
            </section>

            <section class="features-lite">
                <span>No Accounts</span> • <span>No Tracking</span> • <span>No Bloat</span>
            </section>

            <footer>
                <p>Local-first storage. Zero telemetry. Privacy by design.</p>
            </footer>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
